<style>
:root{
--ink:#22243D;
--ink-soft:#5B5F7A;
--ink-faint:#8B90AC;
--surface:#FFFFFF;
--surface-soft:#F3F6FC;
--surface-chip:#EDF1FA;
--coral:#FF6B6B;
--teal:#2AAFA6;
--amber:#F2A93B;
--purple:#7B61E0;
--green:#3FAE5C;
--blue:#4A7DB6;
--blue-deep:#33587F;
--bg-page:#EEF2F9;
--line: rgba(34,36,61,0.09);
--card-shadow: 0 24px 48px -30px rgba(34,36,61,0.28), 0 2px 8px rgba(34,36,61,0.05);
--chip-shadow: 0 2px 6px rgba(34,36,61,0.05);
}
*{box-sizing:border-box;}
body{
margin:0;
min-height:100vh;
position:relative;
overflow-x:hidden;
background:
radial-gradient(circle at 10% 6%, rgba(255,107,107,0.16), transparent 30%),
radial-gradient(circle at 92% 10%, rgba(242,169,59,0.18), transparent 28%),
radial-gradient(circle at 6% 78%, rgba(42,175,166,0.16), transparent 30%),
radial-gradient(circle at 96% 88%, rgba(123,97,224,0.16), transparent 32%),
radial-gradient(circle, rgba(74,125,182,0.10) 2px, transparent 2.4px) 0 0/34px 34px,
var(--bg-page);
font-family:'Nunito', sans-serif;
color:var(--ink);
padding: 28px 20px;
}
.wrap{
max-width:900px;
margin:0 auto;
position:relative;
z-index:1;
}
header{
text-align:center;
margin-bottom:28px;
position:relative;
}
.title-row{
display:flex;
align-items:center;
justify-content:center;
gap:14px;
}
.title-dot{
width:16px; height:16px;
border-radius:50%;
flex:none;
}
header h1{
font-family:'Baloo 2', sans-serif;
font-weight:800;
font-size:clamp(2rem, 5vw, 3.2rem);
margin:0;
letter-spacing:0.5px;
color:var(--ink);
}
header h1 span{ color:var(--blue); }
header p{
margin:10px 0 0;
font-size:1rem;
color:var(--ink-soft);
font-weight:700;
}
.rainbow-bar{
width:150px;
height:6px;
margin:14px auto 0;
border-radius:6px;
background:linear-gradient(90deg, var(--coral), var(--amber), var(--green), var(--teal), var(--purple));
}
.stage{
display:flex;
flex-direction:column;
gap:24px;
align-items:stretch;
max-width:640px;
margin:0 auto;
}
.panel{
background:var(--surface);
border-radius:28px;
box-shadow: var(--card-shadow);
border:1px solid var(--line);
position:relative;
overflow:hidden;
}
.panel::before{
content:"";
position:absolute;
top:0; left:0; right:0;
height:8px;
background:linear-gradient(90deg, var(--coral), var(--amber), var(--green), var(--teal), var(--purple));
}
.clock-card{
padding:22px;
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
}
.digital-row{
display:flex;
align-items:center;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}
.digital{
font-family:'Baloo 2', sans-serif;
font-weight:700;
font-size:2.2rem;
background:linear-gradient(180deg, #FBFCFF, var(--surface-soft));
color:var(--ink);
padding:10px 24px;
border-radius:16px;
letter-spacing:2px;
border:1px solid var(--line);
box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(34,36,61,0.06);
min-width:190px;
text-align:center;
}
.digital .ampm{
font-size:1.1rem;
color:var(--blue);
font-weight:800;
margin-left:6px;
}
.clock-svg-wrap{
width:100%;
max-width:600px;
touch-action:none;
user-select:none;
}
svg{ display:block; width:100%; height:auto; }
.hand{ cursor:grab; touch-action:none; }
.hand:active{ cursor:grabbing; }
.hand-hit{ fill:transparent; stroke:transparent; }
.speech-bubble{
background:var(--surface-soft);
color:var(--ink);
font-family:'Baloo 2', sans-serif;
font-weight:600;
font-size:1.35rem;
border-radius:20px;
padding:14px 20px;
text-align:center;
min-height:34px;
width:100%;
max-width:600px;
position:relative;
border:1px solid var(--line);
box-shadow:0 2px 8px rgba(34,36,61,0.05);
}
.speech-bubble::after{
content:"";
position:absolute;
top:-9px;
left:50%;
transform:translateX(-50%) rotate(45deg);
width:16px; height:16px;
background:var(--surface-soft);
border-left:1px solid var(--line);
border-top:1px solid var(--line);
}
.speak-row{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}
button{
font-family:'Nunito', sans-serif;
font-weight:800;
font-size:0.95rem;
border:none;
border-radius:999px;
padding:12px 20px;
cursor:pointer;
color:#fff;
background:var(--blue);
box-shadow:0 4px 12px -4px rgba(74,125,182,0.55), 0 2px 0 rgba(34,36,61,0.06);
transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
}
button:hover{ filter:brightness(1.05); }
button:active{
transform:translateY(2px);
box-shadow:0 2px 6px -2px rgba(74,125,182,0.55);
}
button.secondary{ background:var(--teal); box-shadow:0 4px 12px -4px rgba(42,175,166,0.55), 0 2px 0 rgba(34,36,61,0.06); }
button.ghost{
background:var(--surface-chip);
color:var(--ink);
border:1.5px solid var(--line);
box-shadow:0 2px 6px rgba(34,36,61,0.04);
}
button.ghost:hover{ border-color:var(--blue); color:var(--blue-deep); filter:none; }
button.ghost:active{ transform:translateY(2px); }
.controls{
padding:24px;
display:grid;
grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
gap:20px;
}
.controls h2{
font-family:'Baloo 2', sans-serif;
margin:0 0 4px;
font-size:1.1rem;
color:var(--blue-deep);
display:flex;
align-items:center;
gap:8px;
padding-bottom:8px;
border-bottom:2px dashed var(--line);
}
.control-group{
display:flex;
flex-direction:column;
gap:10px;
}
.field{
display:flex;
align-items:center;
justify-content:space-between;
background:var(--surface-chip);
padding:12px 14px;
border-radius:14px;
border:1px solid var(--line);
}
.field label{
font-weight:700;
font-size:0.92rem;
color:var(--ink);
}
.switch{
position:relative;
width:50px;
height:28px;
flex:none;
}
.switch input{ opacity:0; width:0; height:0; }
.slider{
position:absolute; inset:0;
background:#D6DCEB;
border-radius:30px;
cursor:pointer;
transition:.2s;
}
.slider::before{
content:"";
position:absolute;
height:20px; width:20px;
left:4px; top:4px;
background:#fff;
box-shadow:0 1px 3px rgba(34,36,61,0.3);
border-radius:50%;
transition:.2s;
}
input:checked + .slider{ background:var(--green); }
input:checked + .slider::before{ transform:translateX(22px); }
.lang-select{
width:100%;
padding:12px 14px;
font-family:'Nunito', sans-serif;
font-weight:800;
font-size:1rem;
color:var(--ink);
background:var(--surface-chip) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9" viewBox="0 0 14 9"><path d="M1 1l6 6 6-6" stroke="%2333587F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
border:1.5px solid var(--line);
border-radius:14px;
appearance:none;
-webkit-appearance:none;
cursor:pointer;
}
.lang-select:focus{ outline:2px solid var(--purple); outline-offset:2px; }
.fmt-group{ display:flex; gap:8px; }
.fmt-btn{
flex:1;
padding:10px 6px;
font-size:0.85rem;
background:var(--surface-chip);
color:var(--ink);
box-shadow:none;
border:1.5px solid var(--line);
}
.fmt-btn.active{
background:var(--coral);
color:white;
border-color:var(--coral);
}
.quick-row{ display:flex; gap:8px; flex-wrap:wrap; }
.quick-row button{ flex:1; font-size:0.85rem; padding:10px; }
footer{
text-align:center;
color:var(--ink-faint);
font-size:0.8rem;
margin-top:26px;
font-weight:600;
}
.brand-row{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:10px;
}
.brand-logo{
width:28px;
height:28px;
border-radius:50%;
object-fit:cover;
border:1.5px solid var(--line);
}
@media (prefers-reduced-motion: reduce){
*{ transition:none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <span class="title-dot" style="background:var(--coral)"></span>
      <h1>Tick <span>Tock</span> Time</h1>
      <span class="title-dot" style="background:var(--teal)"></span>
    </div>
    <p>Drag the hands. Hear the time. Learn the clock.</p>
    <div class="rainbow-bar"></div>
  </header>

  <div class="stage">
    <!-- CLOCK -->
    <div class="panel clock-card">
      <div class="digital-row">
        <div class="digital" id="digitalDisplay">12:00<span class="ampm" id="ampmLabel">AM</span></div>
      </div>

      <div class="clock-svg-wrap">
        <svg id="clockSvg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="faceGrad" cx="50%" cy="42%" r="70%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#F3F1FF"/>
            </radialGradient>
          </defs>

          <!-- outer ring -->
          <circle cx="250" cy="250" r="238" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="2"/>
          <circle cx="250" cy="250" r="230" fill="none" stroke="#4A7DB6" stroke-width="20"/>
          <circle cx="250" cy="250" r="214" fill="url(#faceGrad)"/>

          <!-- telling-time quadrants -->
          <g id="quadrants">
            <path d="M250,250 L 176,102 A 165,165 0 0 1 324,102 Z" fill="#FF6B6B" opacity="0.85"/>
            <path d="M250,250 L 324,102 A 165,165 0 0 1 398,250 Z" fill="#FFD23F" opacity="0.85"/>
            <path d="M250,250 L 398,250 A 165,165 0 0 1 324,398 Z" fill="#5FD068" opacity="0.85"/>
            <path d="M250,250 L 324,398 A 165,165 0 0 1 176,398 Z" fill="#3FCDC4" opacity="0.85"/>
            <path d="M250,250 L 176,398 A 165,165 0 0 1 102,250 Z" fill="#5FD068" opacity="0.85"/>
            <path d="M250,250 L 102,250 A 165,165 0 0 1 176,102 Z" fill="#FF6B6B" opacity="0.85"/>
            <circle cx="250" cy="250" r="164" fill="url(#faceGrad)"/>
          </g>
          <g id="quadLabels" font-family="Baloo 2, sans-serif" font-weight="700" fill="#191A3D" text-anchor="middle">
            <text x="250" y="120" font-size="15">O'CLOCK</text>
            <text x="374" y="255" font-size="15">PAST</text>
            <text x="250" y="392" font-size="15">HALF PAST</text>
            <text x="126" y="255" font-size="15">TO</text>
          </g>

          <g id="minuteHand" class="hand">
            <line x1="250" y1="250" x2="250" y2="118" stroke="transparent" stroke-width="42" class="hand-hit"/>
            <line x1="250" y1="250" x2="250" y2="118" stroke="#3E6690" stroke-width="15" stroke-linecap="round"/>
            <line x1="250" y1="250" x2="250" y2="118" stroke="#4A7DB6" stroke-width="12" stroke-linecap="round"/>
            <text id="minuteLabel" x="250" y="184" text-anchor="middle" dominant-baseline="central"
                  font-family="Baloo 2, sans-serif" font-weight="700" font-size="11"
                  fill="#FFFFFF" letter-spacing="1" transform="rotate(-90 250 184)">MINUTE</text>
          </g>
          <g id="hourHand" class="hand">
            <line x1="250" y1="250" x2="250" y2="158" stroke="transparent" stroke-width="42" class="hand-hit"/>
            <line x1="250" y1="250" x2="250" y2="158" stroke="#D8483F" stroke-width="19" stroke-linecap="round"/>
            <line x1="250" y1="250" x2="250" y2="158" stroke="#FF6B6B" stroke-width="16" stroke-linecap="round"/>
            <text id="hourLabel" x="250" y="204" text-anchor="middle" dominant-baseline="central"
                  font-family="Baloo 2, sans-serif" font-weight="700" font-size="11"
                  fill="#FFFFFF" letter-spacing="1" transform="rotate(-90 250 204)">HOUR</text>
          </g>

          <!-- minute ticks + numbers -->
          <g id="minuteLayer"></g>
          <!-- hour numbers -->
          <g id="hourLayer"></g>

          <circle cx="250" cy="250" r="13" fill="#22243D"/>
          <circle cx="250" cy="250" r="6" fill="#4A7DB6"/>
        </svg>
      </div>

      <div class="speech-bubble" id="wordsDisplay">It's twelve o'clock</div>

      <div class="speak-row">
        <button id="speakBtn">🔊 Say the Time</button>
        <button id="nowBtn" class="secondary">🕐 Set to Now</button>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="panel controls">
      <div class="control-group">
        <h2>👀 Show on Clock</h2>
        <div class="field">
          <label for="toggleHourNums">Hour numbers</label>
          <label class="switch"><input type="checkbox" id="toggleHourNums" checked><span class="slider"></span></label>
        </div>
        <div class="field">
          <label for="toggleMinuteNums">Minute numbers</label>
          <label class="switch"><input type="checkbox" id="toggleMinuteNums"><span class="slider"></span></label>
        </div>
        <div class="field">
          <label for="toggleQuadrants">Telling-time zones</label>
          <label class="switch"><input type="checkbox" id="toggleQuadrants" checked><span class="slider"></span></label>
        </div>
        <div class="field">
          <label for="toggleHandLabels">"Hour" / "minute" labels</label>
          <label class="switch"><input type="checkbox" id="toggleHandLabels" checked><span class="slider"></span></label>
        </div>
      </div>

      <div class="control-group">
        <h2>🕓 Clock Format</h2>
        <div class="fmt-group">
          <button class="fmt-btn active" data-fmt="12">12-hour</button>
          <button class="fmt-btn" data-fmt="24">24-hour</button>
        </div>
        <div class="field" id="ampmField">
          <label for="toggleAmpm">Set as PM</label>
          <label class="switch"><input type="checkbox" id="toggleAmpm"><span class="slider"></span></label>
        </div>
      </div>

      <div class="control-group">
        <h2>🗣️ Language</h2>
        <select class="lang-select" id="langSelect">
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="gu">ગુજરાતી (Gujarati)</option>
        </select>
      </div>

      <div class="control-group">
        <h2>🔁 Talking Clock</h2>
        <div class="field">
          <label for="toggleAutoSpeak">Auto-speak on change</label>
          <label class="switch"><input type="checkbox" id="toggleAutoSpeak"><span class="slider"></span></label>
        </div>
      </div>

      <div class="control-group">
        <h2>🎲 Quick Practice</h2>
        <div class="quick-row">
          <button class="ghost" id="randBtn">Random Time</button>
          <button class="ghost" id="resetBtn">Reset</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
const svg = document.getElementById('clockSvg');
const minuteHand = document.getElementById('minuteHand');
const hourHand = document.getElementById('hourHand');
const minuteLayer = document.getElementById('minuteLayer');
const hourLayer = document.getElementById('hourLayer');
const digitalDisplay = document.getElementById('digitalDisplay');
const ampmLabel = document.getElementById('ampmLabel');
const wordsDisplay = document.getElementById('wordsDisplay');
const quadrants = document.getElementById('quadrants');
const quadLabels = document.getElementById('quadLabels');
let hour = 12;
let isPM = false;
let minute = 0;
let format24 = false;
let lang = 'en';
let autoSpeak = false;
const CX = 250, CY = 250;
const hourColors = ['#FF6B6B','#FFD23F','#5FD068','#3FCDC4','#9D6DF0','#FF9F6B',
'#6BCBFF','#FF6BAE','#B4E36B','#6BFFDA','#FFB86B','#C06BFF'];
function buildHourNumbers(){
hourLayer.innerHTML = '';
for(let i=1;i<=12;i++){
const angle = (i%12) * 30 * Math.PI/180;
const r = 168;
const x = CX + r*Math.sin(angle);
const y = CY - r*Math.cos(angle);
const g = document.createElementNS('http://www.w3.org/2000/svg','g');
const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', 18);
circle.setAttribute('fill', '#E7EAF2');
const text = document.createElementNS('http://www.w3.org/2000/svg','text');
text.setAttribute('x', x); text.setAttribute('y', y);
text.setAttribute('text-anchor','middle');
text.setAttribute('dominant-baseline','central');
text.setAttribute('font-family','Baloo 2, sans-serif');
text.setAttribute('font-weight','800');
text.setAttribute('font-size', i>=10? 20:24);
text.setAttribute('fill', hourColors[i-1]);
text.textContent = i;
g.appendChild(circle); g.appendChild(text);
hourLayer.appendChild(g);
}
}
function buildMinuteLayer(){
minuteLayer.innerHTML = '';
for(let m=0;m<60;m++){
const minuteVal = m===0? 60:m;
const angle = m*6*Math.PI/180;
const isFive = m%5===0;
if(!isFive){
const r1 = 210, r2 = 204;
const x1 = CX + r1*Math.sin(angle), y1 = CY - r1*Math.cos(angle);
const x2 = CX + r2*Math.sin(angle), y2 = CY - r2*Math.cos(angle);
const line = document.createElementNS('http://www.w3.org/2000/svg','line');
line.setAttribute('x1',x1); line.setAttribute('y1',y1);
line.setAttribute('x2',x2); line.setAttribute('y2',y2);
line.setAttribute('stroke', '#22243D');
line.setAttribute('stroke-width', 2);
line.setAttribute('opacity', 0.55);
minuteLayer.appendChild(line);
const rNum = 197;
const xn = CX + rNum*Math.sin(angle), yn = CY - rNum*Math.cos(angle);
const t = document.createElementNS('http://www.w3.org/2000/svg','text');
t.setAttribute('x', xn); t.setAttribute('y', yn+3.5);
t.setAttribute('text-anchor','middle');
t.setAttribute('font-family','Nunito, sans-serif');
t.setAttribute('font-weight','700');
t.setAttribute('font-size', 9);
t.setAttribute('fill', '#22243D');
t.setAttribute('class','minute-number');
t.textContent = minuteVal;
minuteLayer.appendChild(t);
} else {
const rBadge = 203;
const xb = CX + rBadge*Math.sin(angle), yb = CY - rBadge*Math.cos(angle);
const badgeColor = hourColors[(m/5 + 11) % 12];
const g = document.createElementNS('http://www.w3.org/2000/svg','g');
g.setAttribute('class','minute-number');
const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
c.setAttribute('cx', xb); c.setAttribute('cy', yb); c.setAttribute('r', 10);
c.setAttribute('fill', badgeColor);
const t = document.createElementNS('http://www.w3.org/2000/svg','text');
t.setAttribute('x', xb); t.setAttribute('y', yb);
t.setAttribute('text-anchor','middle');
t.setAttribute('dominant-baseline','central');
t.setAttribute('font-family','Nunito, sans-serif');
t.setAttribute('font-weight','800');
t.setAttribute('font-size', 9);
t.setAttribute('fill', '#FFFFFF');
t.textContent = minuteVal;
g.appendChild(c); g.appendChild(t);
minuteLayer.appendChild(g);
}
}
}
buildHourNumbers();
buildMinuteLayer();
applyMinuteVisibility();
applyQuadrantVisibility();
applyHourVisibility();
applyHandLabelVisibility();
function renderHands(){
const minAngle = minute*6;
const hourAngle = ((hour%12) * 30) + (minute*0.5);
minuteHand.setAttribute('transform', `rotate(${minAngle} ${CX} ${CY})`);
hourHand.setAttribute('transform', `rotate(${hourAngle} ${CX} ${CY})`);
}
function pad(n){ return n.toString().padStart(2,'0'); }
function renderDigital(){
let h = hour;
let suffix = '';
if(format24){
let h24 = hour%12;
if(isPM) h24 += 12;
if(hour===12) h24 = isPM? 12:0;
digitalDisplay.innerHTML = `${pad(h24)}:${pad(minute)}`;
ampmLabel.style.display='none';
} else {
digitalDisplay.innerHTML = `${pad(h)}:${pad(minute)}<span class="ampm" id="ampmLabel">${isPM?'PM':'AM'}</span>`;
}
}
function get24Hour(){
let h24 = hour%12;
if(isPM) h24 += 12;
return h24;
}
const numWordsEn = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const numWordsHi = ['','एक','दो','तीन','चार','पांच','छह','सात','आठ','नौ','दस','ग्यारह','बारह'];
const numWordsGu = ['','એક','બે','ત્રણ','ચાર','પાંચ','છ','સાત','આઠ','નવ','દસ','અગિયાર','બાર'];
function minutePhraseEn(m){
const map = {5:'five past',10:'ten past',15:'quarter past',20:'twenty past',25:'twenty-five past',
30:'half past',35:'twenty-five to',40:'twenty to',45:'quarter to',50:'ten to',55:'five to'};
return map[m];
}
function getWordsEn(h, m){
const nextH = h===12?1:h+1;
if(m===0) return `It's ${numWordsEn[h]} o'clock`;
if(m in {5:1,10:1,15:1,20:1,25:1,30:1,35:1,40:1,45:1,50:1,55:1}){
const phrase = minutePhraseEn(m);
if(m<=30) return `It's ${phrase} ${numWordsEn[h]}`;
return `It's ${phrase} ${numWordsEn[nextH]}`;
}
if(m<30) return `It's ${m} minutes past ${numWordsEn[h]}`;
return `It's ${60-m} minutes to ${numWordsEn[nextH]}`;
}
function getWordsHi(h, m){
const nextH = h===12?1:h+1;
if(m===0) return `${numWordsHi[h]} बजे`;
if(m===15) return `सवा ${numWordsHi[h]}`;
if(m===30){
if(h===1) return `डेढ़ बजे`;
if(h===2) return `ढाई बजे`;
return `साढ़े ${numWordsHi[h]}`;
}
if(m===45) return `पौने ${numWordsHi[nextH]}`;
if(m<30) return `${numWordsHi[h]} बजकर ${m} मिनट`;
return `${numWordsHi[nextH]} बजने में ${60-m} मिनट`;
}
function getWordsGu(h, m){
const nextH = h===12?1:h+1;
if(m===0) return `${numWordsGu[h]} વાગ્યા`;
if(m===15) return `સવા ${numWordsGu[h]}`;
if(m===30){
if(h===1) return `દોઢ વાગ્યા`;
if(h===2) return `અઢી વાગ્યા`;
return `સાડા ${numWordsGu[h]}`;
}
if(m===45) return `પોણા ${numWordsGu[nextH]}`;
if(m<30) return `${numWordsGu[h]} વાગીને ${m} મિનિટ`;
return `${numWordsGu[nextH]} વાગવાને ${60-m} મિનિટ`;
}
function getWords(){
if(lang==='hi') return getWordsHi(hour, minute);
if(lang==='gu') return getWordsGu(hour, minute);
return getWordsEn(hour, minute);
}
function renderWords(){
wordsDisplay.textContent = getWords();
}
function renderAll(){
renderHands();
renderDigital();
renderWords();
}
function applyMinuteVisibility(){
const show = document.getElementById('toggleMinuteNums').checked;
minuteLayer.querySelectorAll('.minute-number').forEach(t=>{
t.style.display = show? 'block':'none';
});
}
function applyQuadrantVisibility(){
const show = document.getElementById('toggleQuadrants').checked;
quadrants.style.display = show? 'block':'none';
quadLabels.style.display = show? 'block':'none';
}
function applyHourVisibility(){
const show = document.getElementById('toggleHourNums').checked;
hourLayer.style.display = show? 'block':'none';
}
function applyHandLabelVisibility(){
const show = document.getElementById('toggleHandLabels').checked;
document.getElementById('minuteLabel').style.display = show? 'block':'none';
document.getElementById('hourLabel').style.display = show? 'block':'none';
}
document.getElementById('toggleMinuteNums').addEventListener('change', applyMinuteVisibility);
document.getElementById('toggleQuadrants').addEventListener('change', applyQuadrantVisibility);
document.getElementById('toggleHourNums').addEventListener('change', applyHourVisibility);
document.getElementById('toggleHandLabels').addEventListener('change', applyHandLabelVisibility);
const fmtBtns = document.querySelectorAll('.fmt-btn');
const ampmField = document.getElementById('ampmField');
fmtBtns.forEach(btn=>{
btn.addEventListener('click', ()=>{
fmtBtns.forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
format24 = btn.dataset.fmt === '24';
ampmField.style.opacity = format24? '0.4':'1';
ampmField.style.pointerEvents = format24? 'none':'auto';
renderAll();
});
});
document.getElementById('toggleAmpm').addEventListener('change', (e)=>{
isPM = e.target.checked;
renderAll();
maybeAutoSpeak();
});
document.getElementById('langSelect').addEventListener('change', (e)=>{
lang = e.target.value;
renderWords();
});
document.getElementById('toggleAutoSpeak').addEventListener('change', (e)=>{
autoSpeak = e.target.checked;
});
let cachedVoices = [];
function loadVoices(){
if('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
loadVoices();
window.speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 300);
}
function pickVoice(langPrefix, nameHint){
if(!cachedVoices.length) loadVoices();
if(!cachedVoices.length) return null;
let voice = cachedVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
if(!voice && nameHint){
voice = cachedVoices.find(v => v.name && v.name.toLowerCase().includes(nameHint));
}
if(!voice && langPrefix === 'gu'){
voice = cachedVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('hi'));
}
if(!voice){
voice = cachedVoices.find(v => v.default) || cachedVoices[0];
}
return voice || null;
}
function speak(){
if(!('speechSynthesis' in window)) return;
window.speechSynthesis.cancel();
const text = getWords();
const utter = new SpeechSynthesisUtterance(text);
const prefix = lang==='hi' ? 'hi' : lang==='gu' ? 'gu' : 'en';
const nameHint = lang==='hi' ? 'hindi' : lang==='gu' ? 'gujarati' : 'english';
const voice = pickVoice(prefix, nameHint);
if(voice){
utter.voice = voice;
utter.lang = voice.lang;
} else {
utter.lang = lang==='hi' ? 'hi-IN' : lang==='gu' ? 'gu-IN' : 'en-US';
}
utter.rate = 0.85;
window.speechSynthesis.speak(utter);
}
function maybeAutoSpeak(){
if(autoSpeak) speak();
}
document.getElementById('speakBtn').addEventListener('click', speak);
document.getElementById('nowBtn').addEventListener('click', ()=>{
const d = new Date();
let h24 = d.getHours();
isPM = h24 >= 12;
let h12 = h24 % 12; if(h12===0) h12 = 12;
hour = h12;
minute = d.getMinutes();
document.getElementById('toggleAmpm').checked = isPM;
renderAll();
maybeAutoSpeak();
});
document.getElementById('randBtn').addEventListener('click', ()=>{
hour = Math.floor(Math.random()*12)+1;
minute = Math.floor(Math.random()*12)*5;
isPM = Math.random()<0.5;
document.getElementById('toggleAmpm').checked = isPM;
renderAll();
maybeAutoSpeak();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
hour = 12; minute = 0; isPM = false;
document.getElementById('toggleAmpm').checked = false;
renderAll();
});
function getSvgPoint(evt){
const pt = svg.createSVGPoint();
const touch = evt.touches ? evt.touches[0] : evt;
pt.x = touch.clientX; pt.y = touch.clientY;
const ctm = svg.getScreenCTM().inverse();
return pt.matrixTransform(ctm);
}
function angleFromCenter(p){
let angle = Math.atan2(p.x-CX, -(p.y-CY)) * 180/Math.PI;
if(angle<0) angle += 360;
return angle;
}
function shiftMinute(deltaMinutes){
const hourIndex0 = hour % 12;
let totalMinutes = hourIndex0*60 + minute + deltaMinutes;
totalMinutes = ((totalMinutes % 720) + 720) % 720;
minute = totalMinutes % 60;
const newHourIndex0 = Math.floor(totalMinutes/60);
hour = newHourIndex0===0 ? 12 : newHourIndex0;
}
let dragTarget = null;
let minuteDragLastAngle = 0;
let minuteDragAccumDeg = 0;
let minuteDragBaseTotal = 0;
function startDrag(target){
return function(e){
e.preventDefault();
dragTarget = target;
if(target==='minute'){
minuteDragBaseTotal = (hour % 12)*60 + minute;
minuteDragLastAngle = minute*6;
minuteDragAccumDeg = 0;
}
window.addEventListener('pointermove', onDrag);
window.addEventListener('pointerup', endDrag);
};
}
function onDrag(e){
if(!dragTarget) return;
const p = getSvgPoint(e);
const angle = angleFromCenter(p);
if(dragTarget==='minute'){
let delta = angle - minuteDragLastAngle;
if(delta > 180) delta -= 360;
if(delta < -180) delta += 360;
minuteDragAccumDeg += delta;
minuteDragLastAngle = angle;
const totalMinutes = minuteDragBaseTotal + minuteDragAccumDeg/6;
let totalMod = Math.round(totalMinutes) % 720;
if(totalMod < 0) totalMod += 720;
minute = totalMod % 60;
const hourIndex0 = Math.floor(totalMod/60);
hour = hourIndex0===0 ? 12 : hourIndex0;
} else if(dragTarget==='hour'){
const rawHour = Math.round(angle/30) % 12;
hour = rawHour===0? 12: rawHour;
}
renderAll();
}
function endDrag(){
if(dragTarget) maybeAutoSpeak();
dragTarget = null;
window.removeEventListener('pointermove', onDrag);
window.removeEventListener('pointerup', endDrag);
}
minuteHand.addEventListener('pointerdown', startDrag('minute'));
hourHand.addEventListener('pointerdown', startDrag('hour'));
[minuteHand, hourHand].forEach((el, idx)=>{
el.setAttribute('tabindex','0');
el.setAttribute('role','slider');
el.addEventListener('keydown', (e)=>{
const isMinute = idx===0;
if(e.key==='ArrowRight' || e.key==='ArrowUp'){
if(isMinute) shiftMinute(1); else hour = hour%12 + 1;
renderAll(); maybeAutoSpeak(); e.preventDefault();
} else if(e.key==='ArrowLeft' || e.key==='ArrowDown'){
if(isMinute) shiftMinute(-1); else hour = ((hour+10)%12)+1;
renderAll(); maybeAutoSpeak(); e.preventDefault();
}
});
});
const copyYearEl = document.getElementById('copyYear');
if(copyYearEl) copyYearEl.textContent = new Date().getFullYear();
renderAll();
})();
</script>
